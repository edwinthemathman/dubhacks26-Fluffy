[project]
name = "fluffy"
version = "0.2.0"
description = "Fluffy execution subsystem: validate, authorize, and apply home actions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fluffy = "fluffy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fluffy*", "executor_stub*", "mockhome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
