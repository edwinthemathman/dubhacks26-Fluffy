[project]
name = "fluffy"
version = "0.2.0"
description = "Fluffy: one harness decides, and the v2 executor applies approved plans."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "perceptron>=0.4.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "opencv-python>=5.0.0.93",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "opencv-python>=5.0.0.93",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fluffy = "fluffy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fluffy*", "mockhome*", "executor_stub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
