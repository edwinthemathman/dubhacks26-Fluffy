[project]
name = "fluffy"
version = "0.0.1"
description = "Fluffy inference: perception, world model, consent, and safety."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "perceptron>=0.4.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "opencv-python>=5.0.0.93",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fluffy-demo = "fluffy.demo.app:main"
fluffy-live = "fluffy.live.server:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
