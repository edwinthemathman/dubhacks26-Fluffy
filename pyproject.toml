[project]
name = "fluffy"
version = "0.2.0"
description = "Fluffy: the live companion decides, and the unified harness applies approved plans."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "perceptron>=0.4.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "opencv-python>=5.0.0.93",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "opencv-python>=5.0.0.93",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fluffy = "fluffy.cli:main"
fluffy-demo = "fluffy.demo.app:main"
fluffy-live = "fluffy.live.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fluffy*", "mockhome*", "executor_stub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
